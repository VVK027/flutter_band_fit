name: flutter_band_fit
description: Flutter plugin for UTE smart band BLE connectivity, sync, and vitals on Android and iOS.
version: 0.0.1
homepage:

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  plugin:
    platforms:
      android:
        package: com.vvk.flutter_band_fit
        pluginClass: FlutterBandFitPlugin
      ios:
        pluginClass: FlutterBandFitPlugin
      macos:
        pluginClass: FlutterBandFitPlugin
