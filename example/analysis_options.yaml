include: package:flutter_lints/flutter.yaml

analyzer:
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    missing_required_param: error
    missing_return: error

linter:
  rules:
    # Band/SDK constants mirror native identifiers (SC_SUCCESS, BAND_METHOD_CHANNEL, etc.).
    constant_identifier_names: false
    non_constant_identifier_names: false

    # Stricter typing and API clarity.
    always_declare_return_types: true
    strict_top_level_inference: true
    type_annotate_public_apis: true

    # Prefer const widgets and literals where possible (example app UI).
    prefer_const_constructors: true
    prefer_const_constructors_in_immutables: true
    prefer_const_literals_to_create_immutables: true
    prefer_const_declarations: true
    unused_import: true
    unused_element: true
